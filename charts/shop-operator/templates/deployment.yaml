apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-operator.fullname" . }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shop-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "shop-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          command: [/manager]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DISCORD_SECRET_NAME
              value: {{ .Values.discord.secretName | quote }}
            - name: DISCORD_SECRET_NAMESPACE
              value: {{ .Values.discord.secretNamespace | quote }}
            - name: DISCORD_API_URL
              value: {{ .Values.discord.api| quote }}
            - name: SHOP_AUTH_IMAGE
              value: {{ .Values.images.auth }}
            - name: SHOP_ORDER_IMAGE
              value: {{ .Values.images.order }}
            - name: SHOP_PAYMENT_IMAGE
              value: {{ .Values.images.payment }}
            - name: SHOP_INVENTORY_IMAGE
              value: {{ .Values.images.inventory }}
            - name: SHOP_FRONTEND_IMAGE
              value: {{ .Values.images.frontend }}
            - name: SHOP_IMAGE_PULL_POLICY
              value: {{ .Values.imagePullPolicy }}
            - name: USDT_ADDRESS
              value: {{ .Values.payment.usdtAddress | quote }}
            - name: SEPOLIA_RPC_URL
              value: {{ .Values.payment.sepoliaRpcUrl | quote }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
