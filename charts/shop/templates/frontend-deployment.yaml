{{- if .Values.frontend.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop.frontendName" . }}
  labels:
    {{- include "shop.frontendLabels" . | nindent 4 }}
spec:
  # Replicas follow the shop's availability tier (spec 1.2), not a per-component
  # value: the whole site scales together.
  replicas: {{ include "shop.replicas" . }}
  selector:
    matchLabels:
      {{- include "shop.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the nginx config changes.
        checksum/config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "shop.frontendSelectorLabels" . | nindent 8 }}
    spec:
      # The storefront serves static files only; it never calls the Kubernetes
      # API, so it gets no service account token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ include "shop.image" (dict "registry" .Values.imageRegistry "image" .Values.frontend.image) }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- with .Values.frontend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # Fixed by the image: nginx-unprivileged listens on 8080.
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "shop.frontendName" . }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
