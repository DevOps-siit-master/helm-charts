replicaCount: 1

image:
  repository: shophub-auth-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
auth:
  existingSecret: shophub-auth-secrets

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
readinessProbe:
  httpGet:
    path: /health
    port: 8080

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

httpRoute:
  enabled: false

# shophub-api — the platform backend that manages shop sites by creating Shop /
# Wallet / DiscordChannel custom resources (spec 1.2). Deployed as its own
# component with a ServiceAccount + Role/RoleBinding scoped to the shop namespace.
shophubApi:
  enabled: true
  replicaCount: 2
  image:
    repository: shophub-api
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3001
    # nodePort: 30081  # only used when service.type is NodePort
  # Namespace the Shop/Wallet/DiscordChannel CRs are created in. The
  # shop-operator must watch this namespace.
  shopNamespace: shophub-shops
  # Create the shop namespace as part of this release. Set false if it is
  # managed elsewhere (e.g. by the shop-operator chart or GitOps).
  createShopNamespace: true
  # Template for a deployed shop's public URL; {name} is the Shop CR name.
  shopUrlTemplate: "http://{name}.localhost"
  resources: {}

# shophub-frontend — the admin web UI (spec 1.1 / 1.2). A static SPA served by
# nginx; its config (frontend-configmap.yaml) same-origin-proxies /auth-api to
# the auth-service and /shop-api to shophub-api, so the browser needs no CORS.
# This is the entry point users hit to manage their shop sites.
frontend:
  enabled: true
  # "standard" availability from spec 1.2 → 2 replicas for the platform UI.
  replicaCount: 2
  image:
    repository: shophub-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    # NodePort so the UI is reachable on the local kind cluster without an
    # ingress controller. Users open http://<node-ip>:<nodePort>.
    type: NodePort
    port: 80
    nodePort: 30082
  resources: {}
  # Pod- and container-level security contexts and scheduling controls. Empty
  # by default (no-op); override to harden or pin the frontend pods. The image
  # (nginxinc/nginx-unprivileged) already runs as a non-root user.
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Grafana dashboard for ShopHub platform logs (spec 4.1). Provisioned as a
# ConfigMap that the Grafana sidecar (from the prometheus-stack release, owned
# by the observability work) auto-discovers by label. Queries Loki via the
# datasource registered with uid "loki".
grafanaDashboard:
  enabled: true
  # Label the Grafana sidecar watches for. kube-prometheus-stack defaults to
  # `grafana_dashboard: "1"`; override if the sidecar is configured otherwise.
  label: grafana_dashboard
  labelValue: "1"
  # e.g. { grafana_folder: ShopHub } to drop it into a named Grafana folder.
  annotations: {}

postgres:
  instances: 1
  databaseName: "shophub_auth"
  username: "shophub_admin"
  password: ""
  storageSize: "10Gi"
  storageClass: "local-path"