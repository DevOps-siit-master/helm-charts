apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shophub.fullname" . }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shophub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shophub.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shophub.serviceAccountName" . }}
      initContainers:
        # Block startup until the CNPG database accepts TCP connections, so the
        # app doesn't crash-loop while the cluster is still bootstrapping.
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for $DATABASE_HOST:$DATABASE_PORT ..."
              until nc -z "$DATABASE_HOST" "$DATABASE_PORT"; do sleep 2; done
              echo "Database reachable."
          env:
            - name: DATABASE_HOST
              value: "shophub-db-cluster-rw.{{ .Release.Namespace }}.svc.cluster.local"
            - name: DATABASE_PORT
              value: "5432"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: DATABASE_HOST
              value: "shophub-db-cluster-rw.{{ .Release.Namespace }}.svc.cluster.local"

            - name: DATABASE_PORT
              value: "5432"

            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: shophub-db-cluster-app
                  key: dbname

            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: shophub-db-cluster-app
                  key: username

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shophub-db-cluster-app
                  key: password

            - name: PORT
              value: {{ .Values.service.port | quote }}
              
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: jwt-access-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: jwt-refresh-secret