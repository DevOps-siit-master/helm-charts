name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  lint-charts:
    name: Lint & validate charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: helm lint
        run: |
          for chart in charts/*/; do
            echo "== helm lint $chart =="
            helm lint "$chart"
          done

      - name: helm template (render check)
        run: |
          for chart in charts/*/; do
            echo "== helm template $chart =="
            helm template release "$chart" > /dev/null
          done

      - name: Validate rendered manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          for chart in charts/*/; do
            echo "== kubeconform $chart =="
            # -ignore-missing-schemas: CRD kinds (e.g. CNPG Cluster) have no
            # published schema and are skipped rather than failing the build.
            helm template release "$chart" \
              | ./kubeconform -strict -ignore-missing-schemas -summary
          done

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Verified secrets accidentally committed to the chart repo (values,
      # dashboards, etc.). Diff-scoped on PRs; --only-verified avoids noise.
      - name: Secret scan (TruffleHog)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      # IaC misconfiguration scan. Trivy renders the Helm charts and checks the
      # resulting Kubernetes manifests for security issues (privileged
      # containers, missing securityContext, hostPath mounts, etc.). Gated at
      # CRITICAL,HIGH to keep the signal high; add a .trivyignore for reviewed
      # findings that are intentionally accepted.
      - name: IaC misconfig scan (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: misconfig
          scan-ref: charts/
          exit-code: '1'
          severity: CRITICAL,HIGH
